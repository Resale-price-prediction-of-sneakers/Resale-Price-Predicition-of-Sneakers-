[project]
name = "mlops-lab"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas",
    "mlflow",
    "xgboost>=3.2.0",
    "fastapi>=0.143.1",
    "uvicorn>=0.54.0",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
