name: CI

on: 
  push: 
      branches: [main]      
  pull_request:

jobs: 
  test: 
      runs-on: ubuntu-latest 
      steps: 
        - uses: actions/checkout@v4
         
        - name: Install uv
          uses: astral-sh/setup-uv@v5

        - name: Set up Python
          run: uv python install 3.11

        - name: Install dependencies
          run: uv sync --frozen

        - name: Pull data from DVC remote
          run: |
            uv run dvc remote modify origin --local auth basic
            uv run dvc remote modify origin --local user ${{ secrets.DAGSHUB_USER }}
            uv run dvc remote modify origin --local password ${{ secrets.DAGSHUB_TOKEN }}
            uv run dvc pull

        - name: Run tests
          run: uv run pytest    

  docker:
      runs-on: ubuntu-latest
      needs: test
      steps:
        - uses: actions/checkout@v4

        - name: Build Docker image
          run: docker build -t mlops-lab .
